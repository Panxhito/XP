<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XP HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="xp-hud" class="xp-hud">
        <div class="xp-header">
            <span id="xp-level">Nivel 1</span>
            <span id="xp-total">0 XP</span>
        </div>
        <div class="xp-bar-wrap">
            <div id="xp-bar" class="xp-bar"></div>
        </div>
        <div id="xp-progress" class="xp-progress">0 / 100</div>
    </div>
    <script src="app.js"></script>
</body>
</html>
